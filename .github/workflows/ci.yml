name: Web checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium webkit
      # Playwright builds a separate fixture-configured production artifact.
      # No Supabase/OpenAI/SMTP credentials or hosted requests are used in CI.
      - run: npm test
