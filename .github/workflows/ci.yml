name: Web checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      # Playwright builds a separate fixture-configured production artifact.
      # No Supabase/OpenAI/SMTP credentials or hosted requests are used in CI.
      - run: npm test
      # Verify the actual deployment routes, headers, final bytes and trackers,
      # not just Vite's preview server. Never publish this fixture-configured app.
      - run: npm run build:vercel
        env:
          VITE_SUPABASE_URL: https://web-fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_fixture
